rules:
  - id: guardrail-python-sqli-dynamic-execute
    languages: [python]
    severity: ERROR
    message: >
      SQL query is executed via cursor.execute() with a dynamically built string,
      not a hardcoded literal. This may lead to SQL Injection. Use parameterized
      queries instead (e.g. cursor.execute(query, (param,))).
    patterns:
      - pattern: $CURSOR.execute($QUERY)
      - pattern-not: $CURSOR.execute("...")
      - pattern-not: $CURSOR.execute("...", ...)
    metadata:
      category: security
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"